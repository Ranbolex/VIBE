[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-core-anonymous"
version = "0.1.0"
description = "Core modules for value-informed belief-based edge selection"
requires-python = ">=3.8"
dependencies = ["torch>=1.12.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["vibe_core*"]
